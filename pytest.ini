[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers let you run just the parts you care about:
#   pytest -m demo       -> only the worked examples (these should always pass)
#   pytest -m exercise   -> only your exercises (these fail until you implement them)
markers =
    demo: worked examples that ship implemented; they verify your environment is healthy
    exercise: stubs you implement yourself; expected to fail on a fresh clone

addopts = -ra --strict-markers
